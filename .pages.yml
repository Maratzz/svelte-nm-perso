media:
  - name: blog
    label: Blog
    input: static/blog
    output: /static/blog
    commit:
      templates:
        create: "media: ajout de {filename}"
        rename: "media: renommage de {oldFilename} -> {newFilename}"
        update: "media: update de {filename}"
        delete: "media: suppression de {filename}"
  - name: textes
    label: Textes
    input: static/textes
    output: /static/textes
    commit:
      templates:
        create: "media: ajout de {filename}"
        rename: "media: renommage de {oldFilename} -> {newFilename}"
        update: "media: update de {filename}"
        delete: "media: suppression de {filename}"
content:
  - name: blog
    label: Blog
    type: collection
    path: src/routes/(inside)/blog
    format: yaml-frontmatter
    fields:
    - name: title
      type: string
    - name: slug
      type: string
    - name: headline
      type: string
    - name: date
      type: date
    - name: categories
      type: select
      options:
        values:
          - name: blog
            label: blog
          - name: bilan
            label: bilan
          - name: sveltekit
            label: sveltekit
          - name: sorties
            label: sorties
          - name: à chaud
            label: à chaud
    - name: body
      type: rich-text